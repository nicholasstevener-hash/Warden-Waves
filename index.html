<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101716">
<meta name="description" content="A prison escape survival roguelite. Learn the rules. Break the cycle. Escape the Warden.">
<title>Warden Waves — Break the Cycle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="Prison arena. Move with WASD, arrow keys, or drag to use the touch joystick."></canvas>
<header id="hud" hidden><div><b id="areaLabel"></b><span id="waveLabel"></span></div><div class="health"><i id="healthFill"></i><span id="healthText"></span></div><div class="hudline"><span id="xpLabel"></span><span id="lootLabel"></span><span id="timeLabel"></span><button id="pauseBtn" aria-label="Pause game">Ⅱ</button></div><div id="bossHud" hidden><span id="bossLabel"></span><div class="bossbar"><i id="bossFill"></i></div></div></header>
<div id="notice" role="status" aria-live="polite"></div>
<main id="screen" class="screen"></main>
<div id="stick" hidden><div id="knob"></div></div>
<button id="dashBtn" hidden aria-label="Dodge">DODGE</button>
<script src="core.js"></script><script src="game.js"></script>
</body>
</html>
