<style>:root{color-scheme:dark;--bg:#101716;--panel:#192321;--line:#35453e;--gold:#ebc27b;--ink:#edf0e5;--muted:#a7b6aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:12px 18px;background:#28392f;color:var(--ink);min-height:46px}button:hover{border-color:var(--gold);background:#344a3b}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:var(--gold);color:#17201a;font-weight:750;border-color:var(--gold)}.primary:hover{background:#ffdaa0}.danger{color:#f4a8a0}.screen{position:fixed;inset:0;z-index:10;overflow:auto;background:radial-gradient(ellipse at 75% 10%,#2c3b2e88,transparent 55%),linear-gradient(135deg,#101716f8,#101716ef);padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}.wrap{width:min(1080px,100%);margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.22em;color:var(--gold);font-size:12px;font-weight:700}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:60px;align-items:center}.hero h1{font-size:clamp(56px,8vw,100px);line-height:.95;letter-spacing:-.055em;margin:24px 0}.hero h1 span{color:var(--gold)}h2{font-size:clamp(28px,4vw,42px);line-height:1.1;margin:12px 0 22px}h3{font-size:19px;margin:0 0 10px}p{color:var(--muted);max-width:60ch}small{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.actions button{flex-grow:0}.stats{display:flex;gap:28px;border-top:1px solid var(--line);padding-top:20px;margin-top:28px}.stats b{display:block;font-size:25px}.stats small{font-size:11px;text-transform:uppercase;letter-spacing:.12em}.cellart{position:relative;aspect-ratio:1/.95;background:linear-gradient(130deg,#34433a,#1b2421);border:10px solid #2a35 :8px;overflow:hidden}.health i{display:block;height:100%;background:#709d79}.health span{position:absolute;inset:0;text-align:center;font-size:12px;color:white}.hudline{display:flex;align-items:center;gap:20px;margin-top:6px}.hudline button{pointer-events:auto;margin-left:auto;min-height:36px;padding:3px 15px;background:#17241bdd}#bossHud{max-width:600px;margin:8px auto;text-align:center;color:#ffd1a3}.bossbar{height:9px;background:#201918;margin:6px}.bossbar i{height:100%;display:block;background:#e1a471}#notice{position:fixed;top:32%;width:100%;z-index:4;text-align:center;pointer-events:none;color:var(--gold);font-size:clamp(18px,3vw,30px);font-weight:750;text-shadow:0 3px 8px #000;transition:opacity .3s;padding:0 18px}#stick{position:fixed;width:110px;height:110px;border:1px solid #e6c78b88;background:#11231c66;border-radius:50%;pointer-events:none;z-index:3}#knob{position:absolute;width:42px;height:42px;left:33px;top:33px;border-radius:50%;background:#ebc27baa}#dashBtn{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));border-radius:50%;width:76px;height:76px;background:#23362bbd;z-index:3;padding:0;font-size:12px;font-weight:800;touch-action:none}[hidden]{display:none!important}@media(max-width:700px){.hero{grid-template-columns:1fr;gap:22px}.cellart{display:none}.hero h1{font-size:68px}.screen{padding:26px 20px}.wrap{margin:auto 0}.stats{gap:22px}.actions button{flex:1}.grid{grid-template-columns:1fr}.card{padding:18px}.card p{min-height:0}.toprow{align-items:flex-start}.hudline{gap:12px;font-size:11px}.footer{margin-top:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

<header id="hud" hidden><div><b id="areaLabel"></b><span id="waveLabel"></span></div><div class="health"><i id="healthFill"></i><span id="healthText"></span></div><div class="hudline"><span id="xpLabel"></span><span id="lootLabel"></span><span id="timeLabel"></span><button id="pauseBtn" aria-label="Pause game">Ⅱ</button></div><div id="bossHud" hidden><span id="bossLabel"></span><div class="bossbar"><i id="bossFill"></i></div></div></header>

<script>/* Shared rules: browser globals and Node tests use the same implementation. */
(function(root){
'use strict';
const SAVE_KEY='wardenWavesSave3';
const floors=[
 ['Solitary','Baton Guard','spin','#dbad68','A locked door is not the same as a dead end.'],
 ['Intake','The Registrar','rush','#82c6b4','His charge follows the last place he saw you.'],
 ['General Population','Block Captain','summon','#cfa36b','The captain hides behind his recruits.'],
 ['The Yard','Watchtower Chief','volley','#8fb77d','Keep moving across the firing line.'],
 ['Workshops','The Foreman','slam','#e39d6c','His shield breaks when he commits to a strike.'],
 ['Medical Wing','The Orderly','hazard','#9dcac2','Watch the floor, not just the guards.'],
 ['Maximum Security','Riot Commander','shield','#a6b5d2','His guard drops when he commits to a strike.'],
 ['Death Row','The Executioner','rush','#c17d83','A second charge follows the first.'],
 ['Administration','The Overseer','volley','#c8b6db','Find the gaps between the paper trail.'],
 ["Warden’s Tower",'The Warden','warden','#e3bd67','He changes the rules. Learn each opening.']
].map((a,i)=>({id:i,name:a[0],boss:a[1],pattern:a[2],color:a[3],clue:a[4],waves:10}));
const perks=[
 {id:'damage',name:'Sharpened Edge',text:'+25% damage. Learn the lesson of strength.'},
 {id:'health',name:'Tough Skin',text:'+25 maximum HP and 25 healing. Learn resilience.'},
 {id:'heal',name:'Bandage Wrap',text:'Recover 35 HP (50 after learning recovery). Learn how to recover.'},
 {id:'speed',name:'Prison Legs',text:'+12% movement speed.'},
 {id:'haste',name:'Quick Hands',text:'Attack 15% faster.'},
 {id:'range',name:'Long Reach',text:'+20% weapon range and projectile life.'},
 {id:'pierce',name:'Hard Point',text:'Shivs pierce one more guard; baton hits 15% harder.'},
 {id:'magnet',name:'Hidden Pockets',text:'+45 pickup radius. Gather XP and Contraband from farther away.'}
];
function blank(){return {version:3,contraband:0,days:1,bed:0,workout:0,shivLevel:0,batonLevel:0,library:0,vaultLevel:0,batonUnlocked:false,batonPurchased:false,chosenWeapon:'shiv',lessons:{damage:false,health:false,heal:false},clears:Array(10).fill(0),bestFloor:0,prison:0,vault:[],vaultEnabled:true,totalKills:0,story:{intro:false,mattress:false,vent:false,cache:false,door:false,firstCapture:false,legacyGate:false}};}
function normalize(raw){
 const s=blank();if(!raw||typeof raw!=='object')return s;
 for(const k of ['contraband','days','bed','workout','shivLevel','batonLevel','library','vaultLevel','bestFloor','prison','totalKills'])s[k]=Number.isFinite(raw[k])?Math.max(0,Math.floor(raw[k])):s[k];
 s.days=Math.max(1,s.days);s.bestFloor=Math.min(9,s.bestFloor);s.prison=Math.min(20,s.prison);
 for(const k of ['bed','workout','shivLevel','batonLevel','library','vaultLevel'])s[k]=Math.min(20,s[k]);
 for(const k of ['batonUnlocked','batonPurchased'])s[k]=raw[k]===true;
 s.chosenWeapon=raw.chosenWeapon==='baton'&&s.batonPurchased?'baton':'shiv';
 s.lessons={damage:raw.lessons?.damage===true,health:raw.lessons?.health===true,heal:raw.lessons?.heal===true};
 s.clears=s.clears.map((_,i)=>Number.isFinite(raw.clears?.[i])?Math.max(0,Math.floor(raw.clears[i])):0);
 if(raw.clearedSolitary&&!s.clears[0])s.clears[0]=1;
 s.vault=Array.isArray(raw.vault)?[...new Set(raw.vault.filter(p=>perks.some(x=>x.id===p)))].slice(0,vaultCapacity(s)):[];
 s.vaultEnabled=raw.vaultEnabled!==false;for(const k of Object.keys(s.story))s.story[k]=raw.story?.[k]===true; if(!raw.story){s.story.legacyGate=s.clears[0]>0&&Object.values(s.lessons).every(Boolean);s.story.cache=s.vault.length>0||s.vaultLevel>0;s.story.vent=s.library>0;}return s;
}
function load(storage){
 try{const current=storage.getItem(SAVE_KEY);if(current)return normalize(JSON.parse(current));
 for(const key of ['wardenSolitarySave','wardenSave2']){const old=storage.getItem(key);if(old)return normalize(JSON.parse(old));}
 }catch(_){}return blank();
}
function gateOpen(s){return s.clears[0]>0&&(s.story.door||s.story.legacyGate);}
function vaultCapacity(s){return s.vaultLevel>=8?3:s.vaultLevel>=4?2:1;}
function vaultOpen(s){return s.story.cache||s.vault.length>0||s.vaultLevel>0;}
function mission(s){if(!s.story.mattress)return {id:'mattress',title:'Check the mattress',detail:'Find the bunk across the cell. Someone scratched a message into the wall.',x:155,y:610,label:'SEARCH MATTRESS'};if(!s.story.vent)return {id:'vent',title:'The man behind the vent',detail:'Follow the voice to the northeast wall.',x:1035,y:170,label:'LISTEN AT VENT'};if(!s.story.cache)return {id:'cache',title:'A little insurance',detail:'Reach wave 3, then find your hidden package by the laundry.',x:940,y:655,label:'OPEN HIDDEN CACHE',minWave:3};if(!s.story.door)return {id:'door',title:'Make him open it',detail:'Lead the Baton Guard’s marked strike onto the cracked north door.',x:560,y:65,label:'BAIT HIS STRIKE'};return {id:'escape',title:'The service passage',detail:'Defeat the Baton Guard. The broken door is your way through.',x:560,y:65,label:'SERVICE PASSAGE'};}
function cost(s,id){const bases={bed:20,workout:25,shivLevel:30,batonLevel:40,library:35,vaultLevel:50};return (bases[id]||Infinity)*(s[id]+1);}
function buy(s,id){const c=cost(s,id);if((id==='library'&&!s.story.vent)||(id==='vaultLevel'&&!vaultOpen(s))||s[id]>=20||s.contraband<c||(id==='batonLevel'&&!s.batonPurchased))return false;s.contraband-=c;s[id]++;return true;}
function stats(s,weapon=s.chosenWeapon){return {maxHp:100+s.bed*15,speed:205+Math.min(s.workout,15)*9,damage:weapon==='baton'?20+s.batonLevel*5:15+s.shivLevel*5,interval:weapon==='baton'?Math.max(.25,.65-s.batonLevel*.015):Math.max(.16,.45-s.shivLevel*.012),range:weapon==='baton'?96+s.batonLevel*5:470,magnet:60+s.library*6,pierce:0,weapon};}
function applyPerk(p,id,s){switch(id){case'damage':p.damage*=1.25;break;case'health':p.maxHp+=25;p.hp=Math.min(p.maxHp,p.hp+25);break;case'heal':p.hp=Math.min(p.maxHp,p.hp+(s.lessons.heal?50:35));break;case'speed':p.speed*=1.12;break;case'haste':p.interval=Math.max(.09,p.interval*.85);break;case'range':p.range*=1.2;break;case'pierce':p.pierce++;if(p.weapon==='baton')p.damage*=1.15;break;case'magnet':p.magnet+=45;break;}}
function learn(s,id){if(Object.hasOwn(s.lessons,id))s.lessons[id]=true;}
function choices(s,wave,rng=Math.random){const pool=[...perks];for(let i=pool.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}const forced={7:'damage',8:'health',9:'heal'}[wave];if(forced&&!s.lessons[forced]){return [perks.find(p=>p.id===forced),...pool.filter(p=>p.id!==forced).slice(0,2)];}return pool.slice(0,3);}
function quota(wave,floor){return 10+wave*3+floor*2;}
function bossHealth(floor,prison){return (850+floor*320)*(1+prison*.35);}
const api={SAVE_KEY,floors,perks,blank,normalize,load,gateOpen,vaultCapacity,vaultOpen,mission,cost,buy,stats,applyPerk,learn,choices,quota,bossHealth};
if(typeof module!=='undefined'&&module.exports)module.exports=api;root.WardenRules=api;
})(typeof globalThis!=='undefined'?globalThis:this);
</script><script>/* Warden Waves — no network, framework, or build step required. */
'use strict';
const R=WardenRules,$=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),screen=$('screen');
let save=R.load(localStorage),storageWarning='',state='menu',run=null,keys={},joy={x:0,y:0,id:null},lastTime=0,noticeTime=0,particles=[],camera={w:960,h:640},view={scale:1,x:0,y:0};
const WORLD={w:1120,h:780},touch=matchMedia('(pointer: coarse)').matches;
function persist(){try{localStorage.setItem(R.SAVE_KEY,JSON.stringify(save));storageWarning='';}catch(_){storageWarning='Saving is unavailable in this browser. Keep this tab open to retain this session.';}}
function note(text,time=3){$('notice').textContent=text;noticeTime=time;$('notice').style.opacity=1;}
function resetInput(){keys={};joy={x:0,y:0,id:null};$('stick').hidden=true;$('knob').style.transform='';}
function panel(html){resetInput();screen.innerHTML='<div class="wrap">'+html+'</div>';screen.hidden=false;$('dashBtn').hidden=true;$('hud').hidden=true;$('missionHud').hidden=true;$('interactBtn').hidden=true;$('notice').style.opacity=0;screen.scrollTop=0;screen.querySelector('button')?.focus({preventScroll:true});}
function action(id,fn){$(id)?.addEventListener('click',fn);}
function money(){return `${save.contraband} Contraband`;}
function header(title){return `<div class="toprow"><div><span class="eyebrow">Day ${save.days} · ${money()}</span><h2>${title}</h2></div><button id="back">← Cell</button></div>`;}
function menu(){state='menu';run=null;panel(`<div class="hero"><section><div class="eyebrow">Prison ${save.prison+1} / Inmate 017</div><h1>WARDEN<br><span>WAVES.</span></h1><p>You don’t remember this place.<br>Someone here remembers you.</p><div class="actions"><button class="primary" id="start">Attempt Escape →</button><button id="cell">Your Cell</button><button id="journal">Knowledge / Journal</button></div><div class="stats"><div><b>${String(save.days).padStart(2,'0')}</b><small>Day inside</small></div><div><b>${save.contraband}</b><small>Contraband</small></div><div><b>${save.bestFloor+1} / 10</b><small>Blocks reached</small></div></div></section><div class="cellart" aria-hidden="true"><span class="artlabel">BLACKSTONE / CELL 017</span></div></div><div class="footer">WASD / arrows to move · E to investigate · Space to dodge · Esc to pause · attacks aim automatically.<br>On a phone: drag anywhere in the arena to move. Tap DODGE to evade.<br>Saved on this device. ${storageWarning}<div class="actions"><button id="settings">Save & settings</button>${save.clears[0]>=20&&R.gateOpen(save)?'<button id="checkpoint">Start at Intake · no carried powers</button>':''}</div></div>`);action('start',()=>startRun(0));action('cell',cellMenu);action('journal',journal);action('settings',settings);action('checkpoint',()=>startRun(1,true));}
const upgrades=[['bed','Bed','+15 starting health per level.'],['workout','Workout Corner','+9 movement speed per level (first 15 levels).'],['shivLevel','Shiv Training','More damage and faster throws.'],['batonLevel','Baton Training','More damage, reach, and faster swings.'],['library','Library','Collect XP farther away; +3% XP per level.'],['vaultLevel','Perk Vault','Carry one perk into a new attempt. A second slot at level 4; third at level 8.']];
function cellMenu(){state='cell';panel(header('Your Cell')+`<p>What they take from you is temporary. What you learn stays. Find the voice in the vent to unlock the Library; recover your hidden cache to unlock the Perk Vault.</p><div class="grid">${upgrades.filter(u=>u[0]!=='batonLevel'||save.batonPurchased).map(([id,name,text])=>`<article class="card"><span class="tag">Level ${save[id]} / 20</span><h3>${name}</h3><p>${text}</p><button id="buy-${id}" ${save[id]>=20||save.contraband<R.cost(save,id)||(id==='library'&&!save.story.vent)||(id==='vaultLevel'&&!R.vaultOpen(save))?'disabled':''}>${save[id]>=20?'Fully upgraded':`Upgrade · ${R.cost(save,id)}`}</button></article>`).join('')}</div><div class="actions"><button id="weapons">Weapons</button><button id="vault">Perk Vault</button></div>`);action('back',menu);upgrades.forEach(([id])=>action('buy-'+id,()=>{if(R.buy(save,id)){persist();cellMenu();}}));action('weapons',weaponsMenu);action('vault',vaultMenu);}
function weaponsMenu(){state='weapons';panel(header('Weapons')+`<div class="grid"><article class="card"><span class="tag">Ranged / precision</span><h3>Shiv · level ${save.shivLevel}</h3><p>Automatic throws at the nearest guard. Damage + health journal lessons unlock twin throws.</p><button id="shiv" ${save.chosenWeapon==='shiv'?'disabled':''}>${save.chosenWeapon==='shiv'?'Equipped':'Equip shiv'}</button></article><article class="card"><span class="tag">Melee / crowd control</span><h3>Baton · level ${save.batonLevel}</h3><p>${save.batonUnlocked?'Wide swings hit groups and knock guards back. Stay close, then dodge the counterattack.':'Defeat the Baton Guard in Solitary to unlock this weapon.'}</p><button id="baton" ${!save.batonUnlocked||(!save.batonPurchased&&save.contraband<60)||save.chosenWeapon==='baton'?'disabled':''}>${!save.batonUnlocked?'Locked':!save.batonPurchased?'Purchase · 60':save.chosenWeapon==='baton'?'Equipped':'Equip baton'}</button></article></div>`);action('back',cellMenu);action('shiv',()=>{save.chosenWeapon='shiv';persist();weaponsMenu();});action('baton',()=>{if(!save.batonPurchased){if(save.contraband<60)return;save.contraband-=60;save.batonPurchased=true;}save.chosenWeapon='baton';persist();weaponsMenu();});}
function vaultMenu(){if(!R.vaultOpen(save)){lockedVault();return;}state='vault';panel(header('Perk Vault')+`<p>Keep up to ${R.vaultCapacity(save)} different perks. After an attempt, choose from perks you actually found. Stored perks apply once at the start of each new attempt.</p><div class="grid">${save.vault.length?save.vault.map(id=>`<article class="card"><h3>${R.perks.find(p=>p.id===id).name}</h3><p>${R.perks.find(p=>p.id===id).text}</p><button id="remove-${id}">Remove</button></article>`).join(''):'<article class="card"><h3>Empty shelf</h3><p>Your next attempt may leave something worth keeping.</p></article>'}</div><div class="actions"><button id="vault-toggle">Carried perks: ${save.vaultEnabled?'ON':'OFF'}</button></div>`);action('back',cellMenu);action('vault-toggle',()=>{save.vaultEnabled=!save.vaultEnabled;persist();vaultMenu();});save.vault.forEach(id=>action('remove-'+id,()=>{save.vault=save.vault.filter(p=>p!==id);persist();vaultMenu();}));}
function journal(){state='journal';const clues=[['damage','Strength','A sharper edge teaches you to push back.'],['health','Resilience','Survival starts with what you can endure.'],['heal','Recovery','Even when you feel strong, learn how to mend.']];panel(header('Knowledge / Journal')+`<p>Scratches under the bed: “Three lessons. One door. The Warden counts your victories. The lock counts what you learned.”</p>${clues.map(([id,name,clue])=>`<div class="journal-entry"><h3>${save.lessons[id]?'✓':'○'} ${name}</h3><p>${save.lessons[id]?`Lesson learned: ${R.perks.find(p=>p.id===id).name}.`:clue}</p></div>`).join('')}<div class="journal-entry"><h3>${R.gateOpen(save)?'✓ The service gate is open':'○ A service gate behind Solitary'}</h3><p>${R.gateOpen(save)?'Return to Solitary. Beat its guard again and slip into Intake.':save.clears[0]?'You beat the guard, but winning alone was not the key.':'A guard holds the door. Three late-wave choices hold its secret.'}</p><p>Twin throws: ${save.lessons.damage&&save.lessons.health?'unlocked':'learn strength and resilience'}. Better bandages: ${save.lessons.heal?'unlocked':'learn recovery'}.</p><p>Solitary clears: ${save.clears[0]} / 20 toward starting at Intake without carried powers.</p></div><div class="route">${R.floors.map((f,i)=>`<span class="${save.clears[i]?'done':''}">${i+1}. ${i<=save.bestFloor?f.name:'???'}${save.clears[i]?' ✓':''}</span>`).join('')}</div><p>Current lead: ${R.floors[save.bestFloor].clue}</p>`);action('back',menu);}
function settings(){state='settings';panel(header('Save & Settings')+`<p>Progress stays in this browser on this device. Copy a backup before changing devices or clearing browser data.</p><div class="actions"><button id="export">Copy save backup</button><button id="import">Restore backup</button><button class="danger" id="reset">Erase all progress</button></div><p id="saveStatus" role="status">${storageWarning}</p>`);action('back',menu);action('export',async()=>{const data=JSON.stringify(save);try{await navigator.clipboard.writeText(data);$('saveStatus').textContent='Backup copied. Keep it somewhere safe.';}catch(_){prompt('Copy this save backup:',data);}});action('import',()=>{const raw=prompt('Paste a Warden Waves save backup:');if(!raw)return;try{const data=JSON.parse(raw);if(!data||typeof data!=='object'||Array.isArray(data)||!('contraband'in data))throw Error();if(!confirm('Replace this device’s progress with this backup?'))return;save=R.normalize(data);persist();menu();}catch(_){$('saveStatus').textContent='That backup is not a valid Warden Waves save.';}});action('reset',()=>{if(confirm('Erase all days, upgrades, lessons and campaign progress? This cannot be undone.')){save=R.blank();try{for(const k of [R.SAVE_KEY,'wardenSolitarySave','wardenSave2'])localStorage.removeItem(k);}catch(_){}persist();menu();}});}
function startRun(floor=0,clean=false){const p=R.stats(save);Object.assign(p,{x:WORLD.w/2,y:WORLD.h/2,hp:p.maxHp,r:17,walk:0,throwAnim:0,attack:0,invuln:0,dash:0,dashCooldown:0,dx:0,dy:-1,level:1,xp:0,xpNeed:16});run={p,floor,wave:1,enemies:[],shots:[],hostile:[],drops:[],zones:[],boss:null,spawned:0,kills:0,spawnTimer:0,time:0,floorTime:0,loot:0,earnedKills:0,perks:[],pendingLevels:0,bossDefeated:false,settled:false,swing:0,spotlight:7,clean};particles=[];if(!clean&&save.vaultEnabled&&R.vaultOpen(save))for(const id of save.vault){R.applyPerk(p,id,save);run.perks.push(id);}beginFloor(floor);}

function beginWave(){Object.assign(run,{spawned:0,kills:0,spawnTimer:.5,enemies:[],shots:[],hostile:[],zones:[],boss:null,bossDefeated:false});run.target=R.quota(run.wave,run.floor);}
function makeEnemy(type){const edge=Math.floor(Math.random()*4),inset=30;let x=edge===0?inset:edge===1?WORLD.w-inset:Math.random()*(WORLD.w-60)+30,y=edge===2?inset:edge===3?WORLD.h-inset:Math.random()*(WORLD.h-60)+30;if(Math.hypot(x-run.p.x,y-run.p.y)<180){x=run.p.x<WORLD.w/2?WORLD.w-30:30;y=run.p.y<WORLD.h/2?WORLD.h-30:30;}const f=run.floor,w=run.wave,hard=1+save.prison*.22;type=type||(run.spawned%6===2?'ranged':run.spawned%5===1?'charger':Math.random()<.14?'heavy':Math.random()<.18?'runner':'guard');const hp=(type==='heavy'?65:type==='runner'?24:type==='charger'?48:36)*(1+w*.08+f*.14)*hard;return {x,y,r:type==='heavy'?20:14,hp,maxHp:hp,type,speed:(type==='runner'?132:type==='heavy'?63:type==='ranged'?72:90)+f*3,damage:type==='heavy'?20:14,cooldown:1.2,mode:'chase',timer:0,walk:0,flash:0};}

function collectAll(){/* Drops must be physically collected; wave transitions never award them. */}
function gainXp(value){const p=run.p;p.xp+=value*(1+save.library*.03);while(p.xp>=p.xpNeed){p.xp-=p.xpNeed;p.level++;p.xpNeed=Math.round(p.xpNeed*1.24+5);run.pendingLevels++;}}
function pickUpgrades(reason,after,waveHint=0){state='choice';resetInput();const picks=R.choices(save,waveHint);panel(`<span class="eyebrow">Block ${run.floor+1} · Wave ${run.wave} · Level ${run.p.level}</span><h2>${reason}</h2><p>Choose one find. Run powers last until capture. Journal lessons last forever.</p><div class="grid">${picks.map(p=>`<article class="card"><span class="tag">${Object.hasOwn(save.lessons,p.id)&&!save.lessons[p.id]?'Unlearned lesson':'Run upgrade'}</span><h3>${p.name}</h3><p>${p.text}</p><button class="primary" id="pick-${p.id}">Take it →</button></article>`).join('')}</div>`);picks.forEach(p=>action('pick-'+p.id,()=>{R.applyPerk(run.p,p.id,save);R.learn(save,p.id);run.perks.push(p.id);persist();after();}));}
function resumeWithLevels(){if(run.pendingLevels>0){run.pendingLevels--;pickUpgrades('Level up',resumeWithLevels);}else play();}
function waveDone(){if(run.wave===10){spawnBoss();resumeWithLevels();return;}run.wave++;beginWave();run.spawnTimer=2.2;resumeWithLevels();note(`Wave ${run.wave} / 10 · collect supplies before reinforcements`,2.2);}
function spawnBoss(){run.shots=[];run.hostile=[];run.zones=[];const f=R.floors[run.floor],hp=R.bossHealth(run.floor,save.prison);run.boss={x:WORLD.w/2,y:180,r:32,hp,maxHp:hp,type:'boss',pattern:f.pattern,phase:0,mode:'chase',timer:2,angle:0,flash:0,vx:0,vy:0,open:0};note(`${f.boss} · ${f.clue}`,4);}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function fire(x,y,tx,ty,speed,damage,hostile=false){const a=Math.atan2(ty-y,tx-x),shot={x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:hostile?6:4,damage,life:hostile?6:run.p.range/speed,pierce:run.p.pierce,hits:new Set()};(hostile?run.hostile:run.shots).push(shot);}
function damageTarget(e,damage){let factor=1;if(e.type==='boss'&&['shield','slam'].includes(e.pattern)&&e.open<=0)factor=.35;e.hp-=damage*factor;e.flash=.15;floatText(e.x,e.y-35,Math.round(damage*factor),'#ffe4a8');if(e.hp<=0&&e.type!=='boss')killEnemy(e);}
function attack(){const p=run.p; p.throwAnim=.16;const targets=run.enemies.filter(e=>!e.dead);if(run.boss)targets.push(run.boss);targets.sort((a,b)=>distance(p,a)-distance(p,b));if(!targets.length)return;if(p.weapon==='baton'){run.swing=.15;for(const e of targets){if(distance(p,e)<p.range+e.r){damageTarget(e,p.damage);if(e.type!=='boss'){const a=Math.atan2(e.y-p.y,e.x-p.x);e.x+=Math.cos(a)*24;e.y+=Math.sin(a)*24;}}}}else{const t=targets[0];fire(p.x,p.y,t.x,t.y,570,p.damage);if(save.lessons.damage&&save.lessons.health)fire(p.x+9,p.y+5,t.x+9,t.y+5,570,p.damage*.75);}}
function hurt(damage){if(run.p.invuln>0)return;run.p.hp-=damage;run.p.invuln=.65;burst(run.p.x,run.p.y,'#e29c85',8);}
function dodge(){if(state!=='playing'||run.p.dashCooldown>0)return;const p=run.p;p.dash=.18;p.invuln=Math.max(p.invuln,.25);p.dashCooldown=2.6;}
function pause(){if(state!=='playing')return;state='paused';panel(`<span class="eyebrow">Time stands still</span><h2>Take a breath.</h2><p>Your attempt is paused. Contraband is banked when you return to the cell.</p><div class="actions"><button class="primary" id="resume">Resume attempt</button><button id="retreat">Return to cell · bank ${run.loot}</button></div>`);action('resume',play);action('retreat',()=>finish('You chose to wait for another opening.'));}
function update(dt){if(state!=='playing')return;const p=run.p;run.time+=dt;run.floorTime+=dt;p.invuln=Math.max(0,p.invuln-dt);p.throwAnim=Math.max(0,(p.throwAnim||0)-dt);p.dashCooldown=Math.max(0,p.dashCooldown-dt);run.swing=Math.max(0,run.swing-dt);let mx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),my=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(joy.id!==null){mx=joy.x;my=joy.y;}const len=Math.hypot(mx,my);p.moving=len>0;if(p.moving)p.walk+=dt*11;if(len>0){mx/=Math.max(1,len);my/=Math.max(1,len);p.dx=mx/(Math.hypot(mx,my)||1);p.dy=my/(Math.hypot(mx,my)||1);}if(p.dash>0){p.x+=p.dx*p.speed*3.5*dt;p.y+=p.dy*p.speed*3.5*dt;p.dash-=dt;}else{p.x+=mx*p.speed*dt;p.y+=my*p.speed*dt;}p.x=Math.max(30,Math.min(WORLD.w-30,p.x));p.y=Math.max(40,Math.min(WORLD.h-30,p.y));p.attack-=dt;if(p.attack<=0){attack();p.attack=p.interval;}
 if(!run.boss&&run.spawned<run.target){run.spawnTimer-=dt;if(run.spawnTimer<=0&&run.enemies.length<14+run.floor){run.enemies.push(makeEnemy());run.spawned++;run.spawnTimer=Math.max(.22,.85-run.wave*.035-run.floor*.025);}}
 for(const e of run.enemies){if(!e.dead)updateGuard(e,dt);}
 // Mild separation prevents guards stacking into a single invisible hitbox.
 for(let i=0;i<run.enemies.length;i++)for(let j=i+1;j<run.enemies.length;j++){const a=run.enemies[i],b=run.enemies[j],d=distance(a,b),min=a.r+b.r;if(d>0&&d<min){const push=(min-d)*.5,dx=(a.x-b.x)/d,dy=(a.y-b.y)/d;a.x+=dx*push;a.y+=dy*push;b.x-=dx*push;b.y-=dy*push;}}

 for(const list of [run.shots,run.hostile])for(const b of list){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(list===run.hostile){if(distance(b,p)<b.r+p.r){hurt(b.damage);b.life=0;}}else{for(const e of [...run.enemies,...(run.boss?[run.boss]:[])]){if(e.dead||b.hits.has(e)||b.life<=0)continue;if(distance(b,e)<b.r+e.r){damageTarget(e,b.damage);b.hits.add(e);if(b.pierce<=0)b.life=0;else b.pierce--;}}}}
 for(const z of run.zones){z.time-=dt;if(z.time<=0&&!z.fired){z.fired=true;z.time=.35;if(z.source==='baton')breachDoor(z);if(distance(p,z)<z.r+p.r)hurt(z.damage);burst(z.x,z.y,'#d6a26f',12);}}
 run.zones=run.zones.filter(z=>!z.fired||z.time>0);run.enemies=run.enemies.filter(e=>!e.dead);run.shots=run.shots.filter(b=>b.life>0);run.hostile=run.hostile.filter(b=>b.life>0);
 for(const d of run.drops){const gap=distance(p,d);if(gap<p.magnet){const a=Math.atan2(p.y-d.y,p.x-d.x);d.x+=Math.cos(a)*360*dt;d.y+=Math.sin(a)*360*dt;}if(gap<18){if(d.kind==='loot'){run.loot+=d.value;floatText(p.x,p.y-32,'+'+d.value+' CB','#efd08a');}else if(d.kind==='heal'){p.hp=Math.min(p.maxHp,p.hp+d.value);floatText(p.x,p.y-32,'+'+d.value+' HP','#c8efb5');}else{gainXp(d.value);floatText(p.x,p.y-32,'+'+d.value+' XP','#9adbe1');}d.dead=true;}}
 run.drops=run.drops.filter(d=>!d.dead);
 if(p.hp<=0){finish('The guards drag you back. Your knowledge and Contraband stay with you.');return;}
 if(run.boss&&run.boss.hp<=0){bossWon();return;}
 if(!run.boss&&run.spawned>=run.target&&run.enemies.length===0){waveDone();return;}

}
function zone(x,y,r,delay=1,damage=22){run.zones.push({x,y,r,time:delay,total:delay,damage,fired:false});}
function volley(b,count,offset=0){const a=Math.atan2(run.p.y-b.y,run.p.x-b.x)+offset;for(let i=0;i<count;i++){const angle=a+(i-(count-1)/2)*.24;fire(b.x,b.y,b.x+Math.cos(angle)*100,b.y+Math.sin(angle)*100,180+run.floor*6,14,true);}}
function updateBoss(dt){const b=run.boss,p=run.p,hp=b.hp/b.maxHp;const phase=hp<.25?3:hp<.5?2:hp<.75?1:0;if(phase>b.phase){b.phase=phase;note(phase===3?'LOCKDOWN · last stand':'The guard changes tactics',2);b.timer=Math.min(b.timer,1);}b.angle+=dt*(1.4+b.phase*.35);b.flash=Math.max(0,b.flash-dt);b.open=Math.max(0,b.open-dt);b.timer-=dt;const a=Math.atan2(p.y-b.y,p.x-b.x),pattern=b.pattern==='warden'?['spin','volley','hazard','rush'][b.phase]:b.pattern;
 if(b.mode==='windup'){if(b.timer<=0){b.mode='charge';b.timer=.6;b.open=1.8;}}
 else if(b.mode==='charge'){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.timer<=0){b.mode='recover';b.timer=1.4;}}
 else if(b.mode==='recover'){if(b.timer<=0){if(b.repeat>0){b.repeat--;b.mode='windup';b.timer=.65;b.vx=Math.cos(a)*480;b.vy=Math.sin(a)*480;}else{b.mode='chase';b.timer=2;}}}
 else{const speed=pattern==='volley'?48:pattern==='shield'?85:118+b.phase*12;if(distance(p,b)>55){b.x+=Math.cos(a)*speed*dt;b.y+=Math.sin(a)*speed*dt;}if(b.timer<=0){b.timer=Math.max(1.4,3-b.phase*.3);switch(pattern){case'rush':b.repeat=run.floor===7||b.pattern==='warden'?1:0;b.mode='windup';b.timer=.85;b.vx=Math.cos(a)*(420+b.phase*40);b.vy=Math.sin(a)*(420+b.phase*40);note('CHARGE · move off the line',1);break;case'spin':b.open=1.4;zone(p.x,p.y,100+b.phase*10,1.15,28);run.zones[run.zones.length-1].source='baton';if(b.phase>1)volley(b,3);break;case'summon':for(let i=0;i<2+b.phase;i++)if(run.enemies.length<18)run.enemies.push(makeEnemy(i%2?'runner':'guard'));b.open=2;break;case'volley':volley(b,5+b.phase*2,b.phase%2?.12:0);b.open=1.3;break;case'slam':case'shield':zone(b.x,b.y,145,.95,28);b.open=2;volley(b,3);break;case'hazard':for(let i=0;i<3+b.phase;i++)zone(i?30+Math.random()*(WORLD.w-60):p.x,i?40+Math.random()*(WORLD.h-70):p.y,65,1.2,20);b.open=1.5;break;}}}
 b.x=Math.max(35,Math.min(WORLD.w-35,b.x));b.y=Math.max(50,Math.min(WORLD.h-35,b.y));if(distance(p,b)<p.r+b.r)hurt(b.mode==='charge'?26:16);
}
function bossWon(){const f=run.floor,previous=save.clears[f];collectAll();save.clears[f]++;run.loot+=30+f*15;if(f===0)save.batonUnlocked=true;persist();run.bossDefeated=true;run.hostile=[];run.zones=[];run.enemies=[];if(f===0&&!R.gateOpen(save)){finish(R.gateOpen(save)?'The north door is broken. A service passage waits beyond it.':'The Warden drags you back. The guard fell, but the north door held. Find the voice in the vent, then make the guard break your way out.');return;}if(f===9){save.prison++;persist();finish('You read the Warden’s patterns. You broke the cycle. The gates open—and Prison '+(save.prison+1)+' waits beyond them.',true);return;}state='transition';panel(`<span class="eyebrow">Block ${f+1} cleared · ${R.floors[f].boss} defeated</span><h2>A door finally opens.</h2><p>Next: ${R.floors[f+1].name}. ${R.floors[f+1].clue}</p><p>Keep your build, or leave its temporary powers behind and recover completely. Contraband and journal knowledge stay either way.</p><div class="actions"><button class="primary" id="keep">Keep powers →</button><button id="abandon">Abandon powers · heal fully →</button><button id="bank">Return to cell · bank ${run.loot}</button></div>`);action('keep',()=>{run.p.hp=Math.min(run.p.maxHp,run.p.hp+30);beginFloor(f+1);});action('abandon',()=>{const old=run.p,base=R.stats(save);Object.assign(old,base,{hp:base.maxHp,attack:0,level:1,xp:0,xpNeed:16});run.perks=[];run.pendingLevels=0;beginFloor(f+1);});action('bank',()=>finish('You slip back to your cell with new knowledge.'));}
function finish(text,escaped=false){if(!run||run.settled)return;run.settled=true;state='result';resetInput();if(!save.story.firstCapture&&!escaped){text+=' The Warden kneels beside you: “You always make it this far.”';save.story.firstCapture=true;}const earned=run.loot,found=[...new Set(run.perks)],duration=formatTime(run.time);save.contraband+=earned;save.days++;save.totalKills+=run.earnedKills;persist();panel(`<span class="eyebrow">${escaped?'Escape recorded':'Another day inside'} · ${duration}</span><h2>${escaped?'You escaped.':'Back to your cell.'}</h2><p>${text}</p><div class="stats"><div><b>+${earned}</b><small>Contraband banked</small></div><div><b>${run.earnedKills}</b><small>Guards defeated</small></div><div><b>${run.floor+1}</b><small>Block reached</small></div></div><h3 style="margin-top:28px">${R.vaultOpen(save)?'Store a find in the Perk Vault':'The hidden cache'}</h3><p>${R.vaultOpen(save)?`Tap to select up to ${R.vaultCapacity(save)} perks total. Existing stored perks stay selected.`:'Find the man behind the vent and recover your package to unlock the Perk Vault.'}</p><div class="actions" id="vaultChoices">${(R.vaultOpen(save)?[...new Set([...save.vault,...found])]:[]).map(id=>`<button id="store-${id}" aria-pressed="${save.vault.includes(id)}">${save.vault.includes(id)?'✓ ':''}${R.perks.find(p=>p.id===id).name}</button>`).join('')||'<small>No perks found on this attempt.</small>'}</div><p id="vaultStatus" role="status"></p><div class="actions"><button class="primary" id="continue">Return to cell →</button></div>`);for(const id of R.vaultOpen(save)?[...new Set([...save.vault,...found])]:[])action('store-'+id,()=>{if(save.vault.includes(id))save.vault=save.vault.filter(x=>x!==id);else if(save.vault.length<R.vaultCapacity(save))save.vault.push(id);else{$('vaultStatus').textContent='Vault full. Deselect a stored perk first.';return;}persist();$('store-'+id).textContent=(save.vault.includes(id)?'✓ ':'')+R.perks.find(p=>p.id===id).name;$('store-'+id).setAttribute('aria-pressed',save.vault.includes(id));$('vaultStatus').textContent=`${save.vault.length} / ${R.vaultCapacity(save)} slots used.`;});action('continue',menu);}
function formatTime(t){return `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;}

function breachDoor(z){if(run.floor!==0||!save.story.cache||save.story.door||distance(z,{x:560,y:65})>z.r+35)return;save.story.door=true;persist();note('THE NORTH DOOR BREAKS · defeat the guard to escape',5);floatText(560,105,'SERVICE PASSAGE OPEN','#f3d593');burst(560,65,'#d3c5a2',24);}

journal=function(){state='journal';const m=R.mission(save);panel(header('Evidence / Journal')+`<span class="eyebrow">Chapter One / The Treatment</span><h3>Who is Prisoner 017?</h3><p>${save.story.mattress?'Your own handwriting has survived a treatment your memory did not. Someone has been helping you. Someone else keeps taking you back.':'You woke up without a name. Someone scratched CHECK THE MATTRESS into the wall.'}</p><div class="journal-entry"><h3>${save.story.mattress?'✓ Your handwriting':'○ A message under the mattress'}</h3><p>${save.story.mattress?'“If you’re reading this again, the treatment worked. Find the man behind the vent.”':'Cross the cell and investigate the bunk.'}</p></div><div class="journal-entry"><h3>${save.story.vent?'✓ A voice behind the vent':'○ Someone is tapping'}</h3><p>${save.story.vent?'He knows you. He says you asked him to keep your name secret. The Library is unlocked.':'Follow the tapping to the northeast wall.'}</p></div><div class="journal-entry"><h3>${save.story.cache?'✓ A little insurance':'○ Your hidden package'}</h3><p>${save.story.cache?'You built a hiding place behind the laundry. The Perk Vault is unlocked.':'Find the voice, then reach the laundry during wave 3 or later.'}</p></div><div class="journal-entry"><h3>${save.story.door?'✓ The broken north door':save.story.legacyGate?'✓ A passage you already discovered':'○ Make him open it'}</h3><p>${save.story.door?'The Baton Guard broke the door. Defeat him to use the passage.':save.story.legacyGate?'Your earlier gate discovery is preserved. You can still investigate the new clues.':'Bait the Baton Guard’s marked strike onto the cracked north door. Combat upgrades alone do not open it.'}</p></div><p><b>Current lead:</b> ${m.detail}</p><p>Twin throws: ${save.lessons.damage&&save.lessons.health?'unlocked':'find Sharpened Edge and Tough Skin'}. Stronger bandages: ${save.lessons.heal?'unlocked':'find Bandage Wrap'}.</p><div class="route">${R.floors.map((f,i)=>`<span class="${save.clears[i]?'done':''}">${i+1}. ${i<=save.bestFloor?f.name:'???'}${save.clears[i]?' ✓':''}</span>`).join('')}</div><p>Solitary clears: ${save.clears[0]} / 20 toward the Intake starting point.</p>`);action('back',menu);};
function updateGuard(e,dt){const p=run.p,a=Math.atan2(p.y-e.y,p.x-e.x),d=distance(p,e);e.flash=Math.max(0,(e.flash||0)-dt);e.cooldown-=dt;e.walk=(e.walk||0)+dt*8;

  if(e.mode==='aim'){e.timer-=dt;if(e.timer<=0){e.mode='charge';e.timer=.55;e.vx=Math.cos(e.aim)*430;e.vy=Math.sin(e.aim)*430;}}
  else if(e.mode==='charge'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.timer-=dt;if(e.timer<=0){e.mode='recover';e.timer=1.1;e.cooldown=2.5;}}
  else if(e.mode==='recover'){e.timer-=dt;if(e.timer<=0)e.mode='chase';}

  else{e.x+=Math.cos(a)*108*dt;e.y+=Math.sin(a)*108*dt;}

  if(e.mode==='aim'){e.timer-=dt;if(e.timer<=0){fire(e.x,e.y,e.tx,e.ty,330,18,true);e.mode='chase';e.cooldown=2.5;}}
  else if(e.cooldown<=0&&d<650){e.mode='aim';e.timer=.9;e.tx=p.x;e.ty=p.y;}
  else if(d>300){e.x+=Math.cos(a)*82*dt;e.y+=Math.sin(a)*82*dt;}

 }

function drawGuardTell(e){if(e.mode!=='aim')return;ctx.save();ctx.strokeStyle=e.type==='ranged'?'#f0dca0':'#f0b19a';ctx.lineWidth=e.type==='ranged'?2:9;ctx.setLineDash(e.type==='ranged'?[10,7]:[16,9]);ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.type==='ranged'?e.tx:e.x+Math.cos(e.aim)*370,e.type==='ranged'?e.ty:e.y+Math.sin(e.aim)*370);ctx.stroke();ctx.setLineDash([]);circle(e.x,e.y-e.r-20,5,'#ffe0a6');ctx.restore();}
