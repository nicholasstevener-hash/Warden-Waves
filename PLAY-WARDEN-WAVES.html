<script>/* Shared rules: browser globals and Node tests use the same implementation. */
(function(root){
'use strict';
const SAVE_KEY='wardenWavesSave3';
const floors=[
 ['Solitary','Baton Guard','spin','#dbad68','A locked door is not the same as a dead end.'],
 ['Intake','The Registrar','rush','#82c6b4','His charge follows the last place he saw you.'],
 ['General Population','Block Captain','summon','#cfa36b','The captain hides behind his recruits.'],
 ['The Yard','Watchtower Chief','volley','#8fb77d','Keep moving across the firing line.'],
 ['Workshops','The Foreman','slam','#e39d6c','His shield breaks when he commits to a strike.'],
 ['Medical Wing','The Orderly','hazard','#9dcac2','Watch the floor, not just the guards.'],
 ['Maximum Security','Riot Commander','shield','#a6b5d2','His guard drops when he commits to a strike.'],
 ['Death Row','The Executioner','rush','#c17d83','A second charge follows the first.'],
 ['Administration','The Overseer','volley','#c8b6db','Find the gaps between the paper trail.'],
 ["Warden’s Tower",'The Warden','warden','#e3bd67','He changes the rules. Learn each opening.']
].map((a,i)=>({id:i,name:a[0],boss:a[1],pattern:a[2],color:a[3],clue:a[4],waves:10}));
const perks=[
 {id:'damage',name:'Sharpened Edge',text:'+25% damage. Learn the lesson of strength.'},
 {id:'health',name:'Tough Skin',text:'+25 maximum HP and 25 healing. Learn resilience.'},
 {id:'heal',name:'Bandage Wrap',text:'Recover 35 HP (50 after learning recovery). Learn how to recover.'},
 {id:'speed',name:'Prison Legs',text:'+12% movement speed.'},
 {id:'haste',name:'Quick Hands',text:'Attack 15% faster.'},
 {id:'range',name:'Long Reach',text:'+20% weapon range and projectile life.'},
 {id:'pierce',name:'Hard Point',text:'Shivs pierce one more guard; baton hits 15% harder.'},
 {id:'magnet',name:'Hidden Pockets',text:'+45 pickup radius. Gather XP and Contraband from farther away.'}
];
function blank(){return {version:3,contraband:0,days:1,bed:0,workout:0,shivLevel:0,batonLevel:0,library:0,vaultLevel:0,batonUnlocked:false,batonPurchased:false,chosenWeapon:'shiv',lessons:{damage:false,health:false,heal:false},clears:Array(10).fill(0),bestFloor:0,prison:0,vault:[],vaultEnabled:true,totalKills:0};}
function normalize(raw){
 const s=blank();if(!raw||typeof raw!=='object')return s;
 for(const k of ['contraband','days','bed','workout','shivLevel','batonLevel','library','vaultLevel','bestFloor','prison','totalKills'])s[k]=Number.isFinite(raw[k])?Math.max(0,Math.floor(raw[k])):s[k];
 s.days=Math.max(1,s.days);s.bestFloor=Math.min(9,s.bestFloor);s.prison=Math.min(20,s.prison);
 for(const k of ['bed','workout','shivLevel','batonLevel','library','vaultLevel'])s[k]=Math.min(20,s[k]);
 for(const k of ['batonUnlocked','batonPurchased'])s[k]=raw[k]===true;
 s.chosenWeapon=raw.chosenWeapon==='baton'&&s.batonPurchased?'baton':'shiv';
 s.lessons={damage:raw.lessons?.damage===true,health:raw.lessons?.health===true,heal:raw.lessons?.heal===true};
 s.clears=s.clears.map((_,i)=>Number.isFinite(raw.clears?.[i])?Math.max(0,Math.floor(raw.clears[i])):0);
 if(raw.clearedSolitary&&!s.clears[0])s.clears[0]=1;
 s.vault=Array.isArray(raw.vault)?[...new Set(raw.vault.filter(p=>perks.some(x=>x.id===p)))].slice(0,vaultCapacity(s)):[];

}
function load(storage){
 try{const current=storage.getItem(SAVE_KEY);if(current)return normalize(JSON.parse(current));
 for(const key of ['wardenSolitarySave','wardenSave2']){const old=storage.getItem(key);if(old)return normalize(JSON.parse(old));}
 }catch(_){}return blank();
}
function gateOpen(s){return s.clears[0]>0&&Object.values(s.lessons).every(Boolean);}
function vaultCapacity(s){return s.vaultLevel>=8?3:s.vaultLevel>=4?2:1;}
function cost(s,id){const bases={bed:20,workout:25,shivLevel:30,batonLevel:40,library:35,vaultLevel:50};return (bases[id]||Infinity)*(s[id]+1);}
function buy(s,id){const c=cost(s,id);if(s[id]>=20||s.contraband<c||(id==='batonLevel'&&!s.batonPurchased))return false;s.contraband-=c;s[id]++;return true;}
function stats(s,weapon=s.chosenWeapon){return {maxHp:100+s.bed*15,speed:205+Math.min(s.workout,15)*9,damage:weapon==='baton'?20+s.batonLevel*5:15+s.shivLevel*5,interval:weapon==='baton'?Math.max(.25,.65-s.batonLevel*.015):Math.max(.16,.45-s.shivLevel*.012),range:weapon==='baton'?96+s.batonLevel*5:470,magnet:60+s.library*6,pierce:0,weapon};}
function applyPerk(p,id,s){switch(id){case'damage':p.damage*=1.25;break;case'health':p.maxHp+=25;p.hp=Math.min(p.maxHp,p.hp+25);break;case'heal':p.hp=Math.min(p.maxHp,p.hp+(s.lessons.heal?50:35));break;case'speed':p.speed*=1.12;break;case'haste':p.interval=Math.max(.09,p.interval*.85);break;case'range':p.range*=1.2;break;case'pierce':p.pierce++;if(p.weapon==='baton')p.damage*=1.15;break;case'magnet':p.magnet+=45;break;}}
function learn(s,id){if(Object.hasOwn(s.lessons,id))s.lessons[id]=true;}
function choices(s,wave,rng=Math.random){const pool=[...perks];for(let i=pool.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}const forced={7:'damage',8:'health',9:'heal'}[wave];if(forced&&!s.lessons[forced]){return [perks.find(p=>p.id===forced),...pool.filter(p=>p.id!==forced).slice(0,2)];}return pool.slice(0,3);}
function quota(wave,floor){return 10+wave*3+floor*2;}
function bossHealth(floor,prison){return (850+floor*320)*(1+prison*.35);}
const api={SAVE_KEY,floors,perks,blank,normalize,load,gateOpen,vaultCapacity,cost,buy,stats,applyPerk,learn,choices,quota,bossHealth};
if(typeof module!=='undefined'&&module.exports)module.exports=api;root.WardenRules=api;
})(typeof globalThis!=='undefined'?globalThis:this);
</script><script>/* Warden Waves — no network, framework, or build step required. */
'use strict';
const R=WardenRules,$=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),screen=$('screen');

const WORLD={w:1120,h:780},touch=matchMedia('(pointer: coarse)').matches;

function note(text,time=3){$('notice').textContent=text;noticeTime=time;$('notice').style.opacity=1;}
function resetInput(){keys={};joy={x:0,y:0,id:null};$('stick').hidden=true;$('knob').style.transform='';}
function panel(html){resetInput();screen.innerHTML='<div class="wrap">'+html+'</div>';screen.hidden=false;$('dashBtn').hidden=true;$('hud').hidden=true;$('notice').style.opacity=0;screen.scrollTop=0;screen.querySelector('button')?.focus({preventScroll:true});}

function menu(){state='menu';run=null;panel(`<div class="hero"><section><div class="eyebrow">Prison ${save.prison+1} / Inmate 017</div><h1>WARDEN<br><span>WAVES.</span></h1><p>Learn the rules. Break the cycle.<br>Every attempt leaves something behind.</p><div class="actions"><button class="primary" id="start">Attempt Escape →</button><button id="cell">Your Cell</button><button id="journal">Knowledge / Journal</button></div><div class="stats"><div><b>${String(save.days).padStart(2,'0')}</b><small>Day inside</small></div><div><b>${save.contraband}</b><small>Contraband</small></div><div><b>${save.bestFloor+1} / 10</b><small>Blocks reached</small></div></div></section><div class="cellart" aria-hidden="true"><span class="artlabel">BLACKSTONE / CELL 017</span></div></div><div class="footer">WASD / arrows to move · Space to dodge · Esc to pause · attacks aim automatically.<br>On a phone: drag anywhere in the arena to move. Tap DODGE to evade.<br>Saved on this device. ${storageWarning}<div class="actions"><button id="settings">Save & settings</button>${save.clears[0]>=20&&R.gateOpen(save)?'<button id="checkpoint">Start at Intake · no carried powers</button>':''}</div></div>`);action('start',()=>startRun(0));action('cell',cellMenu);action('journal',journal);action('settings',settings);action('checkpoint',()=>startRun(1,true));}
const upgrades=[['bed','Bed','+15 starting health per level.'],['workout','Workout Corner','+9 movement speed per level (first 15 levels).'],['shivLevel','Shiv Training','More damage and faster throws.'],['batonLevel','Baton Training','More damage, reach, and faster swings.'],['library','Library','Collect XP farther away; +3% XP per level.'],['vaultLevel','Perk Vault','Carry one perk into a new attempt. A second slot at level 4; third at level 8.']];
function cellMenu(){state='cell';panel(header('Your Cell')+`<p>What they take from you is temporary. What you learn stays.</p><div class="grid">${upgrades.filter(u=>u[0]!=='batonLevel'||save.batonPurchased).map(([id,name,text])=>`<article class="card"><span class="tag">Level ${save[id]} / 20</span><h3>${name}</h3><p>${text}</p><button id="buy-${id}" ${save[id]>=20||save.contraband<R.cost(save,id)?'disabled':''}>${save[id]>=20?'Fully upgraded':`Upgrade · ${R.cost(save,id)}`}</button></article>`).join('')}</div><div class="actions"><button id="weapons">Weapons</button><button id="vault">Perk Vault</button></div>`);action('back',menu);upgrades.forEach(([id])=>action('buy-'+id,()=>{if(R.buy(save,id)){persist();cellMenu();}}));action('weapons',weaponsMenu);action('vault',vaultMenu);}
function weaponsMenu(){state='weapons';panel(header('Weapons')+`<div class="grid"><article class="card"><span class="tag">Ranged / precision</span><h3>Shiv · level ${save.shivLevel}</h3><p>Automatic throws at the nearest guard. Damage + health journal lessons unlock twin throws.</p><button id="shiv" ${save.chosenWeapon==='shiv'?'disabled':''}>${save.chosenWeapon==='shiv'?'Equipped':'Equip shiv'}</button></article><article class="card"><span class="tag">Melee / crowd control</span><h3>Baton · level ${save.batonLevel}</h3><p>${save.batonUnlocked?'Wide swings hit groups and knock guards back. Stay close, then dodge the counterattack.':'Defeat the Baton Guard in Solitary to unlock this weapon.'}</p><button id="baton" ${!save.batonUnlocked||(!save.batonPurchased&&save.contraband<60)||save.chosenWeapon==='baton'?'disabled':''}>${!save.batonUnlocked?'Locked':!save.batonPurchased?'Purchase · 60':save.chosenWeapon==='baton'?'Equipped':'Equip baton'}</button></article></div>`);action('back',cellMenu);action('shiv',()=>{save.chosenWeapon='shiv';persist();weaponsMenu();});action('baton',()=>{if(!save.batonPurchased){if(save.contraband<60)return;save.contraband-=60;save.batonPurchased=true;}save.chosenWeapon='baton';persist();weaponsMenu();});}
function vaultMenu(){state='vault';panel(header('Perk Vault')+`<p>Keep up to ${R.vaultCapacity(save)} different perks. After an attempt, choose from perks you actually found. Stored perks apply once at the start of each new attempt.</p><div class="grid">${save.vault.length?save.vault.map(id=>`<article class="card"><h3>${R.perks.find(p=>p.id===id).name}</h3><p>${R.perks.find(p=>p.id===id).text}</p><button id="remove-${id}">Remove</button></article>`).join(''):'<article class="card"><h3>Empty shelf</h3><p>Your next attempt may leave something worth keeping.</p></article>'}</div><div class="actions"><button id="vault-toggle">Carried perks: ${save.vaultEnabled?'ON':'OFF'}</button></div>`);action('back',cellMenu);action('vault-toggle',()=>{save.vaultEnabled=!save.vaultEnabled;persist();vaultMenu();});save.vault.forEach(id=>action('remove-'+id,()=>{save.vault=save.vault.filter(p=>p!==id);persist();vaultMenu();}));}
function journal(){state='journal';const clues=[['damage','Strength','A sharper edge teaches you to push back.'],['health','Resilience','Survival starts with what you can endure.'],['heal','Recovery','Even when you feel strong, learn how to mend.']];panel(header('Knowledge / Journal')+`<p>Scratches under the bed: “Three lessons. One door. The Warden counts your victories. The lock counts what you learned.”</p>${clues.map(([id,name,clue])=>`<div class="journal-entry"><h3>${save.lessons[id]?'✓':'○'} ${name}</h3><p>${save.lessons[id]?`Lesson learned: ${R.perks.find(p=>p.id===id).name}.`:clue}</p></div>`).join('')}<div class="journal-entry"><h3>${R.gateOpen(save)?'✓ The service gate is open':'○ A service gate behind Solitary'}</h3><p>${R.gateOpen(save)?'Return to Solitary. Beat its guard again and slip into Intake.':save.clears[0]?'You beat the guard, but winning alone was not the key.':'A guard holds the door. Three late-wave choices hold its secret.'}</p><p>Twin throws: ${save.lessons.damage&&save.lessons.health?'unlocked':'learn strength and resilience'}. Better bandages: ${save.lessons.heal?'unlocked':'learn recovery'}.</p><p>Solitary clears: ${save.clears[0]} / 20 toward starting at Intake without carried powers.</p></div><div class="route">${R.floors.map((f,i)=>`<span class="${save.clears[i]?'done':''}">${i+1}. ${i<=save.bestFloor?f.name:'???'}${save.clears[i]?' ✓':''}</span>`).join('')}</div><p>Current lead: ${R.floors[save.bestFloor].clue}</p>`);action('back',menu);}
function settings(){state='settings';panel(header('Save & Settings')+`<p>Progress stays in this browser on this device. Copy a backup before changing devices or clearing browser data.</p><div class="actions"><button id="export">Copy save backup</button><button id="import">Restore backup</button><button class="danger" id="reset">Erase all progress</button></div><p id="saveStatus" role="status">${storageWarning}</p>`);action('back',menu);action('export',async()=>{const data=JSON.stringify(save);try{await navigator.clipboard.writeText(data);$('saveStatus').textContent='Backup copied. Keep it somewhere safe.';}catch(_){prompt('Copy this save backup:',data);}});action('import',()=>{const raw=prompt('Paste a Warden Waves save backup:');if(!raw)return;try{const data=JSON.parse(raw);if(!data||typeof data!=='object'||Array.isArray(data)||!('contraband'in data))throw Error();if(!confirm('Replace this device’s progress with this backup?'))return;save=R.normalize(data);persist();menu();}catch(_){$('saveStatus').textContent='That backup is not a valid Warden Waves save.';}});action('reset',()=>{if(confirm('Erase all days, upgrades, lessons and campaign progress? This cannot be undone.')){save=R.blank();try{for(const k of [R.SAVE_KEY,'wardenSolitarySave','wardenSave2'])localStorage.removeItem(k);}catch(_){}persist();menu();}});}
function startRun(floor=0,clean=false){const p=R.stats(save);Object.assign(p,{x:WORLD.w/2,y:WORLD.h/2,hp:p.maxHp,r:13,attack:0,invuln:0,dash:0,dashCooldown:0,dx:0,dy:-1,level:1,xp:0,xpNeed:16});run={p,floor,wave:1,enemies:[],shots:[],hostile:[],drops:[],zones:[],boss:null,spawned:0,kills:0,spawnTimer:0,time:0,floorTime:0,loot:0,earnedKills:0,perks:[],pendingLevels:0,bossDefeated:false,settled:false,swing:0,clean};particles=[];if(!clean&&save.vaultEnabled)for(const id of save.vault){R.applyPerk(p,id,save);run.perks.push(id);}beginFloor(floor);}

}
function drawPerson(e,isPlayer,boss=false){const r=e.r||13;circle(e.x+3,e.y+9,r+3,'#0a100d70');ctx.globalAlpha=isPlayer&&e.invuln>0?.55:1;ctx.fillStyle=e.flash>0?'#fff5d5':isPlayer?'#da914d':boss?R.floors[run.floor].color:e.type==='heavy'?'#8d99a6':e.type==='ranged'?'#729c9b':e.type==='runner'?'#b3b49a':'#759080';ctx.fillRect(e.x-r,e.y-r*.55,r*2,r*1.65);circle(e.x,e.y-r*.85,r*.58,isPlayer?'#deb38b':'#b6b9a0');ctx.fillStyle='#17211a';ctx.fillRect(e.x-r*.8,e.y+r*.65,r*.6,r*.55);ctx.fillRect(e.x+r*.2,e.y+r*.65,r*.6,r*.55);ctx.globalAlpha=1;if(!isPlayer&&e.hp<e.maxHp){ctx.fillStyle='#141a16';ctx.fillRect(e.x-r,e.y-r-14,r*2,4);ctx.fillStyle='#d5bb81';ctx.fillRect(e.x-r,e.y-r-14,r*2*Math.max(0,e.hp/e.maxHp),4);}if(isPlayer){ctx.strokeStyle='#f2dfb6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,r+6,0,Math.PI*2);ctx.stroke();}}
function updateHud(){const p=run.p;$('areaLabel').textContent=`${run.floor+1}. ${R.floors[run.floor].name}`;$('waveLabel').textContent=run.boss?'BOSS':`Wave ${run.wave}/10 · ${run.kills}/${run.target}`;$('healthFill').style.width=Math.max(0,p.hp/p.maxHp*100)+'%';$('healthText').textContent=`${Math.max(0,Math.ceil(p.hp))} / ${p.maxHp} HP`;$('xpLabel').textContent=`LV ${p.level} · XP ${Math.floor(p.xp)}/${p.xpNeed}`;$('lootLabel').textContent=`${run.loot} Contraband`;$('timeLabel').textContent=formatTime(run.time);$('bossHud').hidden=!run.boss;if(run.boss){$('bossLabel').textContent=R.floors[run.floor].boss+(run.boss.open>0?' · OPENING':'');$('bossFill').style.width=Math.max(0,run.boss.hp/run.boss.maxHp*100)+'%';}$('dashBtn').disabled=p.dashCooldown>0;$('dashBtn').textContent=p.dashCooldown>0?p.dashCooldown.toFixed(1):'DODGE';}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)&&state==='playing')e.preventDefault();if(e.key==='Escape'&&!e.repeat){if(state==='playing')pause();else if(state==='paused')play();return;}if(e.code==='Space'&&state==='playing')dodge();keys[e.key.length===1?e.key.toLowerCase():e.key]=true;});addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false;});
canvas.addEventListener('pointerdown',e=>{if(state!=='playing'||joy.id!==null)return;canvas.setPointerCapture(e.pointerId);joy={id:e.pointerId,x:0,y:0,sx:e.clientX,sy:e.clientY};$('stick').style.left=(e.clientX-55)+'px';$('stick').style.top=(e.clientY-55)+'px';$('stick').hidden=false;});canvas.addEventListener('pointermove',e=>{if(joy.id!==e.pointerId)return;const dx=e.clientX-joy.sx,dy=e.clientY-joy.sy,len=Math.hypot(dx,dy),scale=Math.max(45,len);joy.x=dx/scale;joy.y=dy/scale;$('knob').style.transform=`translate(${joy.x*40}px,${joy.y*40}px)`;});function pointerEnd(e){if(joy.id===e.pointerId){joy.id=null;joy.x=joy.y=0;$('stick').hidden=true;$('knob').style.transform='';}}for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,pointerEnd);$('dashBtn').addEventListener('pointerdown',e=>{e.preventDefault();dodge();});$('pauseBtn').addEventListener('click',pause);addEventListener('blur',()=>{resetInput();pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden){resetInput();pause();}});addEventListener('resize',resize);
function loop(now){const dt=Math.min(.04,Math.max(0,(now-lastTime)/1000));lastTime=now;update(dt);draw(dt);if(noticeTime>0&&state==='playing'){noticeTime-=dt;if(noticeTime<=0)$('notice').style.opacity=0;}requestAnimationFrame(loop);}
resize();menu();requestAnimationFrame(loop);
</script>
